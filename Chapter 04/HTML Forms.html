<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        p {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #45a049;
        }
    </style>
    </style>
</head>

<body>
    <h1>Forms in HTML</h1>
    <form action="/submit.php">
        <div>
            <label for="name">Name:</label>
            <input id="name" type="text" placeholder="Enter Name">
        </div>

        <div>
            <label for="Phone">Phone:</label>
            <input id="Phone" type="tel" placeholder="Enter Phone Number" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input id="email" type="email" placeholder="Enter email address" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input id="password" type="password" placeholder="Enter password" required>
        </div>

        <div>
            <label for="dob">Date of birth:</label>
            <input id="dob" type="date" required>
        </div>

        <div>
            <label for="gender">Gender:</label>
            <select id="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div>
            <p>Subscriptions</p>
            <input id="Basic" type="radio" name="Subscriptions" value="Basic">
            <label for="Basic">Basic</label>

            <input id="Premium" type="radio" name="Subscriptions" value="Premium">
            <label for="Premium">Premium</label>

            <input id="VIP" type="radio" name="Subscriptions" value="VIP">
            <label for="VIP">VIP</label>
        </div>

        <div>
            <input id="terms" type="checkbox" required>
            <label for="terms">I agree to the terms and condition"></label>
        </div>

        <div>
            <label for="comments">Comments:</label>
            <textarea id="comments" placeholder="Enter your comments" rows="4"></textarea>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>


    </form>
    </forms>
</body>

</html>
