<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useful Websites</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        .container {
            margin-top: 40px;
        }

        .card {
            background: white;
            width: 300px;
            margin: 15px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
        }

        a {
            text-decoration: none;
            color: #0078d7;
            font-size: 18px;
            font-weight: bold;
        }

        a:hover {
            color: #ff6600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Useful Websites</h1>
        <p>Quick links to popular websites</p>
    </header>

    <div class="container">

        <div class="card">
            <a href="https://www.google.com" target="_blank">
                Google
            </a>
            <p>Search anything on the web.</p>
        </div>

        <div class="card">
            <a href="https://www.microsoft.com" target="_blank">
                Microsoft
            </a>
            <p>Official Microsoft website.</p>
        </div>

        <div class="card">
            <a href="https://www.github.com" target="_blank">
                GitHub
            </a>
            <p>Code hosting platform for developers.</p>
        </div>

        <div class="card">
            <a href="https://www.youtube.com" target="_blank">
                YouTube
            </a>
            <p>Watch videos and tutorials.</p>
        </div>

    </div>

</body>
</html>
