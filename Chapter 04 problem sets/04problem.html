<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        table {
            width: 60%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        thead {
            background-color: #007bff;
            color: white;
        }

        th,
        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background-color: #f2f2f2;
            transition: 0.3s;
        }

        th {
            font-size: 18px;
        }

        td {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Player name</th>
                <th>Score</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Virat Kohli</td>
                <td>100</td>
            </tr>

            <tr>
                <td>Shreyas Iyer</td>
                <td>90</td>
            </tr>

            <tr>
                <td>Rohit Sharma</td>
                <td>80</td>
            </tr>

            <tr>
                <td>KL Rahul</td>
                <td>100</td>
            </tr>

            <tr>
                <td>Rahul Dravid</td>
                <td>95</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
