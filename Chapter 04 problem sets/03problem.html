<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form for booking a vacation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 5px rgba(79, 172, 254, 0.5);
        }

        p {
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #007bff;
        }
    </style>
</head>

<body>
    
    <form>
        <div>
            <label for="name">Name:</label>
            <input id="name" type="name" placeholder="Enter your name" required>
        </div>

        <div>
            <label for="age">Age:</label>
            <input id="age" type="number" placeholder="Enter your age" required>
        </div>

        <div>
            <label for="dob">Date of birth:</label>
            <input id="dob" type="date" placeholder="Enter your date of birth" required>
        </div>

        <div>
            <label for="phone">Phone number:</label>
            <input id="phone" type="tel" placeholder="Enter your phone number" required>
        </div>

        <div>
            <label for="email">Email Address:</label>
            <input id="email" type="email" placeholder="Enter your email address" required>
        </div>

        <div>
            <label for="gender">Gender:</label>
            <select id="gender" required>
                <option value="" disabled selected>Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div>
            <p>Subscription plan</p>
            <input id="Basic" type="radio" name="Subscription" value="basic">
            <label for="Basic">Basic</label>
        </div>

        <div>
            <input id="Premium" type="radio" name="subscription" value="premium">
            <label for="Premium">Premium</label>
        </div>

        <div>
            <input id="terms" type="checkbox" required>
            <label for="terms">I agree to the terms and conditions</label>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>

</html>
